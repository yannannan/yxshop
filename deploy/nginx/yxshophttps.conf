# 站点配置参考，对应 /etc/nginx/conf.d/yxshophttps.conf。
# 根据用户服务器截图整理；应用目录为 /home/www/yxshop/yxshopdev，端口为 3000。
# 现有站点若有额外配置，只添加下方“百度站点文件验证”location，不必覆盖整个文件。
server {
    listen 80;
    server_name www.yxstar.shop;

    return 301 https://www.yxstar.shop$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.yxstar.shop;

    ssl_certificate /etc/nginx/conf.d/cert/www.yxstar.shop.pem;
    ssl_certificate_key /etc/nginx/conf.d/cert/www.yxstar.shop.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # 百度站点文件验证：使用百度下载的原始文件，保持文件名和内容不变。
    # URL 为 /baidu_verify_....html，文件放在项目 public/ 的直接下级。
    # 未找到文件时返回 404，不转到商城首页。
    location ~ ^/baidu_verify_[A-Za-z0-9_-]+\.html$ {
        root /home/www/yxshop/yxshopdev/public;
        default_type text/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
