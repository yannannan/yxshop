# 站点配置参考，对应 /etc/nginx/conf.d/yxshophttps.conf。
# 域名静态根目录为 /home/www；应用目录为 /home/www/yxshop/yxshopdev，端口为 3000。
# 现有站点若有额外配置，合并 server 层 root 和根目录 HTML 规则，不必覆盖整个文件。
server {
    listen 80;
    server_name www.yxstar.shop;

    return 301 https://www.yxstar.shop$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.yxstar.shop;
    root /home/www;

    ssl_certificate /etc/nginx/conf.d/cert/www.yxstar.shop.pem;
    ssl_certificate_key /etc/nginx/conf.d/cert/www.yxstar.shop.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # 根目录 HTML 通用映射：/about.html -> /home/www/about.html。
    # 同时支持百度验证文件，保持百度原始文件名及内容不变。
    # 此规则只匹配根目录单层 HTML；/tools/*.html 等业务路径继续反代。
    location ~ ^/[A-Za-z0-9_-]+\.html$ {
        default_type text/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
